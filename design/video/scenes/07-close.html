<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.stage{display:grid;place-items:center;padding:0;background:var(--ink);color:var(--paper)}
html,body{background:var(--ink)}
.wrap{text-align:center}
.icon{width:220px;border-radius:48px;opacity:0;transform:scale(.9);animation:logo .8s cubic-bezier(.2,.7,.2,1) .2s forwards}
@keyframes logo{to{opacity:1;transform:none}}
h1{margin:60px auto 0;max-width:none;color:var(--paper);font-size:96px}
.g{color:var(--green-bright)}
.cta{margin-top:50px;display:inline-flex;align-items:center;gap:16px;padding:22px 40px;border-radius:20px;background:var(--green);color:#fff;font-size:30px;font-weight:700;opacity:0;animation:in .6s 1.6s forwards}
.url{margin-top:28px;font-size:26px;color:rgba(244,241,234,.6);opacity:0;animation:in .6s 2.2s forwards}
</style>
<div class="stage"><div class="wrap">
  <img class="icon" src="../assets/app-icon.svg" alt="">
  <h1 class="in d2">Sort by sales<span class="g">.</span> Upsell by AI<span class="g">.</span></h1>
  <div class="cta">Install free on the Shopify App Store</div>
  <div class="url">apps.shopify.com/qsortby · Free plan available</div>
</div></div>
