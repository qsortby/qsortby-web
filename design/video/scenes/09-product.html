<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="base.js"></script><script src="data.js"></script>
<style>
.pdp{position:absolute;left:260px;top:190px;width:1400px;height:900px;background:#fff;border-radius:28px 28px 0 0;border:1px solid var(--line);box-shadow:0 40px 100px -40px rgba(16,24,40,.3);padding:34px 48px;overflow:hidden}
.pdp .nav{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:26px}.pdp .nav span{display:flex;gap:24px;font-size:11px;color:var(--muted)}
.two{display:grid;grid-template-columns:420px 1fr;gap:48px}
.hero{aspect-ratio:1;border-radius:18px;background:#efe8da;display:grid;place-items:center}.hero img{width:56%}
.ttl{font-size:34px;font-weight:700;letter-spacing:-.02em}.price{font-size:22px;margin:10px 0 14px}
.desc{font-size:14px;color:var(--muted);line-height:1.5;max-width:48ch}
.btn{margin-top:22px;max-width:360px}
.fbt{margin-top:28px;padding:20px;border-radius:16px;border:1px solid var(--green-line);background:var(--green-soft);opacity:0;animation:in .7s 2.2s forwards}
.fbt .k{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green-ink)}
.fbt .items{display:flex;align-items:center;gap:14px;margin-top:12px}
.fbt .it{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;opacity:0;animation:in .5s forwards}
.fbt .plus{font-size:20px;color:var(--faint)}
.fbt .sum{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted)}.fbt .sum b{font-size:18px;color:var(--ink)}
.fbt .add{padding:10px 16px;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:13px}
.callout{left:1480px;top:720px;opacity:0;animation:in .6s 4.4s forwards}
</style>
<div class="stage">
  <div class="pdp in d0"><div class="nav">AURORA<span><b>New Arrivals</b><b>Apparel</b><b>Home</b><b>Beauty</b></span></div>
    <div class="two"><div class="hero"><img src="../assets/products/tee.svg"></div>
      <div><div class="ttl">Ridge Wool Sweater</div><div class="price">$165</div>
        <div class="desc">Midweight lambswool, ribbed cuffs, cut for layering. Restocked in four colours.</div>
        <span class="btn">Add to cart</span>
        <div class="fbt"><span class="k">Frequently bought together · from your orders</span>
          <div class="items">
            <div class="it" style="animation-delay:2.6s"><span class="thumb"><img src="../assets/products/tee.svg"></span>Ridge Wool Sweater</div><span class="plus">+</span>
            <div class="it" style="animation-delay:2.9s"><span class="thumb"><img src="../assets/products/cap.svg"></span>Wool Scarf</div><span class="plus">+</span>
            <div class="it" style="animation-delay:3.2s"><span class="thumb"><img src="../assets/products/candle-amber.svg"></span>Ember Candle</div>
            <div class="sum"><span><b>$259</b> · save $20</span><span class="add">Add all three</span></div>
          </div></div></div></div></div>
  <div class="callout"><b>+9%</b>bundle attach rate</div>
</div>
