<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="base.js"></script>
<style>
.c{position:absolute;inset:0;display:grid;place-items:center}
.wrap{text-align:center;margin-top:-80px}
.logo{width:460px;opacity:0;transform:scale(.94);animation:lg .9s cubic-bezier(.2,.7,.2,1) .2s forwards}@keyframes lg{to{opacity:1;transform:none}}
h1{margin-top:64px;font-size:104px;line-height:1.05;letter-spacing:-.04em;font-weight:700}
h1 span{display:inline-block;opacity:0;transform:translateY(18px);animation:in .5s cubic-bezier(.2,.7,.2,1) forwards}
.a1{animation-delay:1.1s}.a2{animation-delay:1.25s}.a3{animation-delay:1.4s}.b1{animation-delay:2.1s}.b2{animation-delay:2.25s}.b3{animation-delay:2.4s}
.g{color:var(--ink);animation:dot .4s ease forwards}.g1{animation-delay:1.8s!important}.g2{animation-delay:2.8s!important}
@keyframes dot{to{opacity:1;transform:none;color:var(--green)}}
.s{margin-top:34px;font-family:var(--mono);font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);opacity:0;animation:in .6s 3.2s forwards}
</style>
<div class="stage"><div class="c"><div class="wrap">
  <img class="logo" src="../assets/logo.svg" alt="">
  <h1><span class="a1">Sort</span> <span class="a3">smarter<span class="g g1">.</span></span><br><span class="b1">Sell</span> <span class="b2">more</span> <span class="b3">with AI<span class="g g2">.</span></span></h1>
  <div class="s">Collection sorting &amp; AI upsell · Shopify</div>
</div></div></div>
<script>watermark()</script>
