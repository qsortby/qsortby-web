<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="base.js"></script>
<style>
.c{position:absolute;inset:0;display:grid;place-items:center}.wrap{text-align:center;margin-top:-60px}
.icon{width:150px;border-radius:34px;opacity:0;transform:scale(.9);animation:lg .8s cubic-bezier(.2,.7,.2,1) .2s forwards}@keyframes lg{to{opacity:1;transform:none}}
h2{margin:40px auto 0;font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1.15;max-width:26ch}h2 em{font-style:italic;color:var(--green-ink)}
h1{margin-top:34px;font-size:84px;font-weight:700;letter-spacing:-.04em}h1 .g{color:var(--green)}
.cta{margin-top:40px;display:inline-flex;align-items:center;gap:14px;padding:20px 36px;border-radius:16px;background:var(--ink);color:#fff;font-size:24px;font-weight:700;opacity:0;animation:in .6s 4s forwards}
.cta i{width:28px;height:28px;border-radius:7px;background:var(--green)}
.url{margin-top:22px;font-family:var(--mono);font-size:14px;letter-spacing:.2em;color:var(--muted);opacity:0;animation:in .6s 4.6s forwards}
</style>
<div class="stage"><div class="c"><div class="wrap">
  <img class="icon" src="../assets/app-icon.svg" alt="">
  <h2 class="in d2">Your collections, auto-sorted by <em>what's actually selling</em> right now.</h2>
  <h1 class="in d5">Sort smarter<span class="g">.</span> Sell more with AI<span class="g">.</span></h1>
  <div class="cta"><i></i>Free to install on the Shopify App Store</div>
  <div class="url">APPS.SHOPIFY.COM/QSORTBY</div>
</div></div></div>
<script>watermark()</script>
