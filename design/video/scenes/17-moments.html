<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="base.js"></script>
<style>
.six{position:absolute;left:50%;top:380px;transform:translateX(-50%) scale(1.55);transform-origin:top center}

<div class="stage"><div class="cap">Six moments · one engine</div><div class="six" id="six"></div></div>
