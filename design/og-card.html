<!-- SOURCE OF public/og-default.jpg — the site's social share card.
     Render at exactly 1600×900 and save as JPEG q90 into public/og-default.jpg:

       npx playwright screenshot --viewport-size=1600,900 \
         file://$PWD/design/og-card.html public/og-default.jpg

     Two rules for editing this file:
     1. NOTHING here may show behaviour the app does not have. The card this
        replaced showed rows labelled PINNED and a "BOOST WINDOW" meter; neither
        exists. What is drawn now is a product climbing on live demand and a
        sold-out product sinking — both shipped.
     2. It has to survive being shrunk. Most feeds render a share card near
        500px wide, so the headline is the only thing that must be legible; keep
        it large and keep the element count low.

     The font path below is absolute so the file renders standalone. -->
<meta charset="utf-8">
<style>
@font-face{font-family:'Be Vietnam Pro';font-style:normal;font-weight:400;
  src:url('file:///Users/qdn/GitHub/qsortby-web/public/fonts/bevietnam-400.woff2') format('woff2');}
@font-face{font-family:'Be Vietnam Pro';font-style:normal;font-weight:500;
  src:url('file:///Users/qdn/GitHub/qsortby-web/public/fonts/bevietnam-500.woff2') format('woff2');}
@font-face{font-family:'Be Vietnam Pro';font-style:normal;font-weight:600;
  src:url('file:///Users/qdn/GitHub/qsortby-web/public/fonts/bevietnam-600.woff2') format('woff2');}
@font-face{font-family:'Be Vietnam Pro';font-style:normal;font-weight:700;
  src:url('file:///Users/qdn/GitHub/qsortby-web/public/fonts/bevietnam-700.woff2') format('woff2');}
@font-face{font-family:'Be Vietnam Pro';font-style:normal;font-weight:800;
  src:url('file:///Users/qdn/GitHub/qsortby-web/public/fonts/bevietnam-800.woff2') format('woff2');}

:root{
  --ink:#1a1a1a; --ink-2:#474747; --muted:#6b6f76;
  --green:#00a36b; --green-ink:#067a55; --green-soft:#e9f6f0; --green-line:#cbe8da;
  --line:#e4e5e7; --surface:#fff; --paper:#f7f8f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px}
body{
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  background:
    radial-gradient(120% 90% at 88% 8%, #eef8f3 0%, rgba(238,248,243,0) 58%),
    linear-gradient(180deg,#ffffff 0%, #f7f9f8 100%);
  color:var(--ink);
  display:grid; grid-template-columns:1fr 620px; align-items:center;
  padding:92px 96px; gap:72px;
}

/* ---------- left ---------- */
.eyebrow{
  display:flex; align-items:center; gap:12px;
  font-size:21px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); margin-bottom:34px;
}
.eyebrow i{width:11px;height:11px;border-radius:50%;background:var(--green);display:block}

h1{
  font-size:88px; line-height:1.06; font-weight:700; letter-spacing:-.036em;
}
h1 .g{color:var(--green-ink)}
.sub .g{color:var(--green)}

.sub{
  margin-top:32px; font-size:32px; line-height:1.4; color:var(--ink-2); font-weight:500;
}

.mark{
  display:flex; align-items:center; gap:16px; margin-top:54px;
}

/* ---------- right: the order, drawn without any invented UI ---------- */
.stack{
  background:var(--surface); border:1px solid var(--line); border-radius:26px;
  padding:30px 30px 32px; box-shadow:0 2px 3px rgba(16,24,40,.04), 0 40px 70px -34px rgba(16,24,40,.26);
}
.stack .hd{
  display:flex; align-items:center; justify-content:space-between;
  font-size:20px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); padding:0 6px 22px; border-bottom:1px solid var(--line); margin-bottom:22px;
}
.row{display:flex; align-items:center; gap:20px; padding:17px 14px; border-radius:16px}
.row .n{
  width:34px; font-size:25px; font-weight:700; color:#b6bcc0;
  font-variant-numeric:tabular-nums; text-align:center;
}
.row .th{width:56px;height:56px;border-radius:13px;background:#eceae4;flex:none}
.row .bar{height:13px;border-radius:7px;background:#e8eaec;flex:1}
.row .bar i{display:block;height:100%;border-radius:7px;background:#cfd4d8;width:var(--w)}

.row.up{background:var(--green-soft); border:1px solid var(--green-line); padding:16px 13px}
.row.up .n{color:var(--green-ink)}
.row.up .th{background:#d8ece1}
.row.up .bar{background:#cfe8db}
.row.up .bar i{background:linear-gradient(90deg,var(--green),#2bd996)}
.pill{
  font-size:21px; font-weight:700; letter-spacing:.02em; padding:7px 15px; border-radius:999px;
  background:var(--green); color:#fff; flex:none;
}
.row.out{opacity:.62}
.row.out .th{background:#eeeceb}
.pill.grey{background:#e9ebed; color:#7c838a}
</style>

<div>
  <div class="eyebrow"><i></i>Shopify collection merchandising</div>
  <h1>Sort your<br>collections.<br><span class="g">See why.<br>Prove it worked.</span></h1>
  <p class="sub">Sort smarter<span class="g">.</span> Sell more with AI<span class="g">.</span> Upsells learned from your own orders.</p>
  <div class="mark">
    <!-- The logo, inline from public/logo.svg (brand guideline 2026-11). The
         wordmark is part of the logo artwork — the guideline forbids setting
         the product name in any other font, so no <span> beside the symbol. -->
    <img src="file:///Users/qdn/GitHub/qsortby-web/public/logo.svg" width="249" height="60" alt="QSortby">
  </div>
</div>

<div class="stack">
  <div class="hd"><span>Collection order</span><span>Live</span></div>
  <div class="row up"><span class="n">1</span><span class="th"></span><span class="bar"><i style="--w:100%"></i></span><span class="pill">&#9650; 3</span></div>
  <div class="row"><span class="n">2</span><span class="th"></span><span class="bar"><i style="--w:74%"></i></span></div>
  <div class="row"><span class="n">3</span><span class="th"></span><span class="bar"><i style="--w:58%"></i></span></div>
  <div class="row"><span class="n">4</span><span class="th"></span><span class="bar"><i style="--w:41%"></i></span></div>
  <div class="row out"><span class="n">5</span><span class="th"></span><span class="bar"><i style="--w:22%"></i></span><span class="pill grey">Sold out</span></div>
</div>
